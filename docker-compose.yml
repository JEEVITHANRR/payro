version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       payro_db
      POSTGRES_USER:     payro_user
      POSTGRES_PASSWORD: payro_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payro_user -d payro_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payro_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payro_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://payro_user:payro_password@postgres:5432/payro_db?schema=public
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      NODE_ENV:     production
    ports:
      - '4000:4000'
    volumes:
      - ./backend/logs:/app/logs

volumes:
  postgres_data:
